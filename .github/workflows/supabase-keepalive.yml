# Daily Supabase keep-alive. A free-tier project pauses after ~7 days with no
# activity; one cheap request per day through the REST API prevents that.
# Ascend has no backend or Vercel cron, so this runs from GitHub Actions.
#
# Setup: repo Settings > Secrets and variables > Actions, add
#   SUPABASE_URL              e.g. https://abcdxyzcompany.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the same anon/publishable key the frontend uses
name: Supabase keep-alive

on:
  schedule:
    # Daily at 10:23 UTC (3:23am Pacific, 6:23am Eastern): the quietest hours for
    # US users. Off the top of the hour because GitHub delays or drops scheduled
    # runs at :00 when its queue is busiest.
    - cron: '23 10 * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY secret" >&2
            exit 1
          fi
          # RLS may return an empty array; the request still hits the database.
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $status"
          case "$status" in 2*) ;; *) exit 1 ;; esac
